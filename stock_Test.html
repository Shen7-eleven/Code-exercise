<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投資模擬練習器</title>
<style>
  :root {
    --bg: #121e2c;
    --panel: #1a2532;
    --panel-2: #22303f;
    --accent: #43eb81;
    --accent-red: #f87171;
    --text: #e5e7eb;
    --text-dim: #94a3b8;
    --border: #343e49;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    margin-bottom: 4px;
  }
  .subtitle {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .card h2 {
    font-size: 13px;
    color: var(--text-dim);
    margin: 0 0 6px 0;
    font-weight: 500;
  }
  .card .value {
    font-size: 24px;
    font-weight: 600;
  }
  .value.up { color: var(--accent); }
  .value.down { color: var(--accent-red); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 15px;
    margin-top: 0;
  }
  .form-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  select, input, button {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
  }
  input {
    width: 120px;
  }
  button {
    cursor: pointer;
    font-weight: 600;
    border: none;
  }
  button.buy {
    background: var(--accent);
    color: #06280f;
  }
  button.sell {
    background: var(--accent-red);
    color: #3a0a0a;
  }
  button:hover {
    filter: brightness(1.1);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 8px;
    border-bottom: 1px solid var(--border);
  }
  th {
    color: var(--text-dim);
    font-weight: 500;
  }
  .empty-row td {
    color: var(--text-dim);
    text-align: center;
    padding: 20px;
  }

  .log {
    max-height: 160px;
    overflow-y: auto;
    font-size: 12px;
    color: var(--text-dim);
  }
  .log div {
    padding: 4px 0;
    border-bottom: 1px dashed var(--border);
  }
</style>
</head>
<body>
<div class="container">
  <h1>投資模擬練習器</h1>
  <div class="subtitle">練習用的假投資工具（純前端，資料不會保存）</div>

  <div class="grid">
    <div class="card">
      <h2>現金餘額</h2>
      <div class="value" id="cashValue">$100,000</div>
    </div>
    <div class="card">
      <h2>總資產</h2>
      <div class="value" id="totalValue">$100,000</div>
    </div>
  </div>

  <div class="panel">
    <h2>下單</h2>
    <div class="form-row">
      <select id="stockSelect">
        <option value="AAPL" data-price="190">AAPL - 190</option>
        <option value="TSM" data-price="900">TSM - 900</option>
        <option value="NVDA" data-price="130">NVDA - 130</option>
        <option value="2330" data-price="1000">2330 台積電 - 1000</option>
      </select>
      <input type="number" id="qtyInput" placeholder="股數" min="1" value="10">
      <button class="buy" id="buyBtn">買進</button>
      <button class="sell" id="sellBtn">賣出</button>
    </div>
  </div>

  <div class="panel">
    <h2>持股明細</h2>
    <table>
      <thead>
        <tr>
          <th>股票</th>
          <th>股數</th>
          <th>均價</th>
          <th>市值</th>
        </tr>
      </thead>
      <tbody id="holdingsBody">
        <tr class="empty-row"><td colspan="4">目前沒有持股</td></tr>
      </tbody>
    </table>
  </div>

  <div class="panel">
    <h2>交易紀錄</h2>
    <div class="log" id="tradeLog">
      <div>尚無交易紀錄</div>
    </div>
  </div>
</div>

<script>
  let cash = 100000;
  const holdings = {}; // { symbol: { qty, avgPrice } }
  const tradeLogEl = document.getElementById('tradeLog');
  const holdingsBody = document.getElementById('holdingsBody');
  const cashValueEl = document.getElementById('cashValue');
  const totalValueEl = document.getElementById('totalValue');
  const stockSelect = document.getElementById('stockSelect');
  const qtyInput = document.getElementById('qtyInput');

  function getSelectedPrice() {
    const opt = stockSelect.options[stockSelect.selectedIndex];
    return Number(opt.dataset.price);
  }

  function formatMoney(n) {
    return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 2 });
  }

  function logTrade(text) {
    if (tradeLogEl.children.length === 1 && tradeLogEl.children[0].textContent === '尚無交易紀錄') {
      tradeLogEl.innerHTML = '';
    }
    const div = document.createElement('div');
    const time = new Date().toLocaleTimeString();
    div.textContent = `[${time}] ${text}`;
    tradeLogEl.prepend(div);
  }

  function buy() {
    const symbol = stockSelect.value;
    const price = getSelectedPrice();
    const qty = Number(qtyInput.value);

    if (!qty || qty <= 0) {
      alert('請輸入有效股數');
      return;
    }

    const cost = price * qty;
    if (cost > cash) {
      alert('現金不足');
      return;
    }

    cash -= cost;

    if (holdings[symbol]) {
      const h = holdings[symbol];
      const totalCost = h.avgPrice * h.qty + cost;
      h.qty += qty;
      h.avgPrice = totalCost / h.qty;
    } else {
      holdings[symbol] = { qty, avgPrice: price };
    }

    logTrade(`買進 ${symbol} x${qty} @ ${price}`);
    render();
  }

  function sell() {
    const symbol = stockSelect.value;
    const price = getSelectedPrice();
    const qty = Number(qtyInput.value);

    if (!qty || qty <= 0) {
      alert('請輸入有效股數');
      return;
    }

    const h = holdings[symbol];
    if (!h || h.qty < qty) {
      alert('持股不足');
      return;
    }

    h.qty -= qty;
    cash += price * qty;

    if (h.qty === 0) {
      delete holdings[symbol];
    }

    logTrade(`賣出 ${symbol} x${qty} @ ${price}`);
    render();
  }

  function render() {
    cashValueEl.textContent = formatMoney(cash);

    let holdingsValue = 0;
    const rows = Object.entries(holdings).map(([symbol, h]) => {
      const opt = Array.from(stockSelect.options).find(o => o.value === symbol);
      const currentPrice = opt ? Number(opt.dataset.price) : h.avgPrice;
      const marketValue = currentPrice * h.qty;
      holdingsValue += marketValue;
      return `<tr>
        <td>${symbol}</td>
        <td>${h.qty}</td>
        <td>${h.avgPrice.toFixed(2)}</td>
        <td>${formatMoney(marketValue)}</td>
      </tr>`;
    });

    holdingsBody.innerHTML = rows.length
      ? rows.join('')
      : '<tr class="empty-row"><td colspan="4">目前沒有持股</td></tr>';

    const total = cash + holdingsValue;
    totalValueEl.textContent = formatMoney(total);
    totalValueEl.className = 'value ' + (total >= 100000 ? 'up' : 'down');
  }

  document.getElementById('buyBtn').addEventListener('click', buy);
  document.getElementById('sellBtn').addEventListener('click', sell);

  render();
</script>
</body>
</html>
